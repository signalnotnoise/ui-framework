name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore "UI Framework.slnx"
      - name: Validate release candidate
        shell: pwsh
        run: ./tools/Test-Release.ps1 -NoRestore
      - name: Upload test and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: artifacts/release-validation/
          if-no-files-found: warn
      - name: Validate NuGet packages
        shell: pwsh
        run: ./tools/Test-Packages.ps1 -NoBuild
      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-preview
          path: artifacts/packages/
          if-no-files-found: warn
