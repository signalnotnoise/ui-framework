name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  performance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Measure against accepted baseline
        shell: pwsh
        run: ./tools/Test-Performance.ps1 -IncludeLayoutEditors -OutputDirectory artifacts/performance/ci
      - name: Save performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-comparison
          path: |
            artifacts/performance/ci/*.json
            artifacts/performance/ci/*.md
            artifacts/performance/ci/*.log
          if-no-files-found: warn
      - name: Show comparison
        if: always()
        shell: pwsh
        run: |
          if (Test-Path artifacts/performance/ci/summary.md) {
            Get-Content artifacts/performance/ci/summary.md >> $env:GITHUB_STEP_SUMMARY
          }
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore "UI Framework.slnx"
      - name: Validate release candidate
        shell: pwsh
        run: ./tools/Test-Release.ps1 -NoRestore
      - name: Upload test and stress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-validation
          path: artifacts/release-validation/
          if-no-files-found: warn
      - name: Validate NuGet packages
        shell: pwsh
        run: ./tools/Test-Packages.ps1 -NoBuild
      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-preview
          path: artifacts/packages/
          if-no-files-found: warn
